name: Staging Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/ref to verify (e.g. main, for a post-batch check)"
        required: false
        default: "main"

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: staging-verify-${{ github.event.pull_request.number || github.event.inputs.ref || 'manual' }}
  cancel-in-progress: true

jobs:
  staging-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine skip / target ref / check depth
        id: plan
        env:
          # toJSON of an absent/null value renders as the literal string
          # "null" rather than erroring, so this is safe on non-pull_request
          # events too. Avoids the `.labels.*.name` wildcard selector, whose
          # null-safety on a missing pull_request context isn't worth
          # trusting without testing.
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels) }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Batch-PR mode: label a PR "skip-staging" to opt it out of its own
          # check, then trigger this workflow manually (workflow_dispatch)
          # against main once the whole batch is merged, for one consolidated
          # verification instead of N per-PR runs. Skips are still commented
          # on the PR (not silent) so an unverified merge stays visible.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if echo "$PR_LABELS_JSON" | grep -q '"name":[[:space:]]*"skip-staging"'; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
            echo "target_ref=${{ github.event.pull_request.head.ref }}" >> "$GITHUB_OUTPUT"
            echo "job_name=staging-check-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

            # Check depth: the live-ingest smoke test (real worker dispatch
            # against real external APIs) is by far the most expensive part
            # of the check (~57% of total time) and most commits don't touch
            # anything it would catch. Run it only when the diff touches a
            # path that could plausibly break dispatch/ingest, or when the
            # PR is explicitly labeled `full-check`. Everything else still
            # gets mypy + unit + integration tests (never skipped here) --
            # this only trims the smoke sub-phase, not the whole check.
            CHANGED_FILES=$(git diff --name-only "${BASE_SHA}" HEAD)
            echo "Changed files:"
            echo "$CHANGED_FILES"
            CRITICAL_REGEX='^p8/workers/|^p8/services/queue\.py$|^p8/services/percolate/|^p8/ontology/types\.py$|^sql/|^manifests/staging/percolate-check-job\.yaml$|^\.github/workflows/(staging-verify|deploy)\.yml$|^pyproject\.toml$|^uv\.lock$'
            if echo "$PR_LABELS_JSON" | grep -q '"name":[[:space:]]*"full-check"'; then
              echo "run_smoke=true" >> "$GITHUB_OUTPUT"
              echo "smoke_reason=full-check label" >> "$GITHUB_OUTPUT"
            elif echo "$CHANGED_FILES" | grep -qE "$CRITICAL_REGEX"; then
              echo "run_smoke=true" >> "$GITHUB_OUTPUT"
              echo "smoke_reason=diff touches a dispatch/ingest-critical path" >> "$GITHUB_OUTPUT"
            else
              echo "run_smoke=false" >> "$GITHUB_OUTPUT"
              echo "smoke_reason=no dispatch/ingest-critical paths changed" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "target_ref=${{ github.event.inputs.ref || 'main' }}" >> "$GITHUB_OUTPUT"
            echo "job_name=staging-check-manual-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
            # Manual/batch runs verify a consolidated set of changes (often
            # after several skip-staging PRs merged) -- always run the full
            # check rather than trying to diff against an ambiguous base.
            echo "run_smoke=true" >> "$GITHUB_OUTPUT"
            echo "smoke_reason=manual/batch run" >> "$GITHUB_OUTPUT"
          fi

      - name: Post skip comment
        if: github.event_name == 'pull_request' && steps.plan.outputs.skip == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body \
            "## ⏭️ Staging check skipped (\`skip-staging\` label)

          Intentionally not run — part of a batch being verified together. Trigger \`Staging Verify\` manually (workflow_dispatch) against \`main\` after the batch merges to verify the combined result. This comment exists so the skip is visible, not silent."

      - name: Set up kubectl
        if: steps.plan.outputs.skip != 'true'
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        if: steps.plan.outputs.skip != 'true'
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Run staging check Job on cluster
        id: run
        if: steps.plan.outputs.skip != 'true'
        run: |
          JOB_NAME="${{ steps.plan.outputs.job_name }}"
          echo "job_name=$JOB_NAME" >> "$GITHUB_OUTPUT"

          sed \
            -e "s|name: staging-check|name: ${JOB_NAME}|" \
            -e "s|value: \"main\"|value: \"${{ steps.plan.outputs.target_ref }}\"|" \
            -e "s|value: \"auto\"|value: \"${{ steps.plan.outputs.run_smoke }}\"|" \
            manifests/staging/percolate-check-job.yaml | kubectl apply -f -

          echo "Waiting for pod to appear..."
          for i in $(seq 1 30); do
            POD=$(kubectl get pods -n p8-staging -l job-name="$JOB_NAME" --no-headers -o custom-columns=NAME:.metadata.name 2>/dev/null | tail -1)
            [ -n "$POD" ] && break
            sleep 5
          done
          echo "pod=$POD" >> "$GITHUB_OUTPUT"

          echo "Waiting for runner container to finish (timeout 15m)..."
          EXIT_CODE=""
          for i in $(seq 1 180); do
            STATE=$(kubectl get pod "$POD" -n p8-staging -o jsonpath='{.status.containerStatuses[?(@.name=="runner")].state.terminated.exitCode}' 2>/dev/null)
            if [ -n "$STATE" ]; then
              EXIT_CODE="$STATE"
              break
            fi
            sleep 5
          done

          if [ -z "$EXIT_CODE" ]; then
            echo "result=timeout" >> "$GITHUB_OUTPUT"
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
          elif [ "$EXIT_CODE" = "0" ]; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
            echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          fi

          kubectl logs "$POD" -n p8-staging -c runner --tail=150 > staging-log.txt 2>&1 || true

      - name: Clean up Job
        if: always() && steps.plan.outputs.skip != 'true'
        run: |
          kubectl delete job "${{ steps.plan.outputs.job_name }}" -n p8-staging --ignore-not-found

      - name: Build result comment/summary body
        if: always() && steps.plan.outputs.skip != 'true'
        run: |
          RESULT="${{ steps.run.outputs.result }}"
          if [ "$RESULT" = "pass" ]; then
            BADGE="✅ Staging check passed"
          elif [ "$RESULT" = "timeout" ]; then
            BADGE="⏱️ Staging check timed out (15m)"
          else
            BADGE="❌ Staging check failed"
          fi

          TEST_SECONDS=$(grep -o 'test_phase_seconds=[0-9]*' staging-log.txt 2>/dev/null | tail -1 | cut -d= -f2)
          DURATION_LINE=""
          if [ -n "$TEST_SECONDS" ]; then
            DURATION_LINE="**Unit+integration test phase: ${TEST_SECONDS}s** (budget: 300s)"
            if [ "$TEST_SECONDS" -gt 300 ] 2>/dev/null; then
              DURATION_LINE="⚠️ **Unit+integration test phase: ${TEST_SECONDS}s — over the 300s budget, getting slow**"
            fi
          fi

          if [ "${{ steps.plan.outputs.run_smoke }}" = "true" ]; then
            DEPTH_LINE="**Depth:** full (mypy + unit + integration + live-ingest smoke test) — ${{ steps.plan.outputs.smoke_reason }}"
          else
            DEPTH_LINE="**Depth:** fast (mypy + unit + integration, smoke test skipped) — ${{ steps.plan.outputs.smoke_reason }}. Add the \`full-check\` label and re-run to force the smoke test."
          fi

          {
            echo "## $BADGE"
            echo ""
            echo "Real migration + mypy + unit + integration tests, run on p8-arm. Depth-gated: the live-ingest smoke test only runs when warranted (see below)."
            echo ""
            echo "**Ref:** \`${{ steps.plan.outputs.target_ref }}\`"
            echo ""
            echo "$DEPTH_LINE"
            [ -n "$DURATION_LINE" ] && echo "" && echo "$DURATION_LINE"
            echo ""
            echo "<details><summary>Last 150 lines of output</summary>"
            echo ""
            echo '```'
            cat staging-log.txt 2>/dev/null | tail -150
            echo '```'
            echo "</details>"
          } > comment-body.md

      - name: Post result as PR comment
        if: always() && github.event_name == 'pull_request' && steps.plan.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file comment-body.md --repo ${{ github.repository }}

      - name: Post result to job summary (manual/batch runs)
        if: always() && github.event_name != 'pull_request' && steps.plan.outputs.skip != 'true'
        run: cat comment-body.md >> "$GITHUB_STEP_SUMMARY"
