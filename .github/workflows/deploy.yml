name: Deploy

on:
  push:
    branches: [main]
    # Allow-list, not a blocklist: only these paths actually affect what
    # Dockerfile COPYs into the running image. Anything else (docs, staging
    # manifests, tests, .schema/, etc.) is irrelevant to the deployed app -
    # deploying because of a docs change is wasted build time, not caution.
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "p8/**"
      - "sql/**"
      - "Dockerfile"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: deploy-p8-arm
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify staging check passed for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Branch protection (required status checks) isn't available on this
          # plan (private repo, free tier). This is the substitute: refuse to
          # deploy code whose PR's staging check clearly failed. It can't stop
          # a bad merge from landing in git history, but it stops it from
          # reaching production.
          PR_NUMBER=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].number' 2>/dev/null || echo "")

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No associated PR found for this commit (direct push, or pre-dates the staging gate) — proceeding."
            exit 0
          fi

          LAST_COMMENT=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json comments --jq '[.comments[] | select(.body | contains("Staging check"))] | last | .body' 2>/dev/null || echo "")

          if [ -z "$LAST_COMMENT" ]; then
            echo "No staging check comment found on PR #$PR_NUMBER — proceeding (staging-verify may not have run for this PR)."
          elif echo "$LAST_COMMENT" | grep -q "✅ Staging check passed"; then
            echo "Staging check passed for PR #$PR_NUMBER — proceeding."
          else
            echo "::error::Staging check did NOT pass for PR #$PR_NUMBER — refusing to deploy. Fix and re-run staging-verify before merging next time, or re-trigger it and merge a fix."
            exit 1
          fi

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Run database migrations
        run: |
          # The app's own DB role is intentionally restricted (can't run DDL),
          # so migrations run directly against the postgres pod via its local
          # peer-trust socket (kubectl exec), piping in each already-checked-out
          # sql/*.sql file. Idempotent scripts, safe to run before the new image
          # rolls out -- new tables/columns existing before new code needs them
          # beats the reverse.
          for f in sql/*.sql; do
            echo "Running $f..."
            if ! kubectl exec -i p8-postgres-1 -n p8 -- psql -U postgres -d p8db -v ON_ERROR_STOP=1 < "$f"; then
              echo "::error::Migration failed on $f"
              exit 1
            fi
            echo "  $f applied"
          done
          echo "Migration complete"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: percolationlabs
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            percolationlabs/p8k8:arm64
            percolationlabs/p8k8:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Roll out p8-api
        run: |
          kubectl set image deployment/p8-api p8-api=percolationlabs/p8k8:sha-${{ github.sha }} -n p8
          kubectl rollout status deployment/p8-api -n p8 --timeout=180s

      - name: Post-deploy summary
        if: always()
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-12)
          WHOAMI_CODE=$(curl -sS -o /tmp/whoami_body.json -w "%{http_code}" https://api.percolationlabs.ai/whoami/ || echo "000")
          WHOAMI_STATUS="✅ HTTP $WHOAMI_CODE"
          if [ "$WHOAMI_CODE" != "200" ]; then WHOAMI_STATUS="❌ HTTP $WHOAMI_CODE"; fi

          {
            echo "## Deploy summary"
            echo ""
            echo "**Image:** \`percolationlabs/p8k8:sha-${SHA_SHORT}\`"
            echo "**Commit:** [${SHA_SHORT}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})"
            echo ""
            echo "### Quick checks"
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| API (\`/whoami\`) | $WHOAMI_STATUS |"
            echo ""
            echo "**Response body:**"
            echo '```json'
            cat /tmp/whoami_body.json 2>/dev/null || echo "(no response body)"
            echo '```'
            echo ""
            echo "### Pods"
            echo '```'
            kubectl get pods -n p8 2>&1 || echo "kubectl get pods failed"
            echo '```'
            echo ""
            echo "### Useful links"
            echo "- Live API: https://api.percolationlabs.ai/whoami/"
            echo "- This run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "_For a deeper narrated health check (logs, anomalies), comment \`@claude check cluster health\` on any issue — optional, not run automatically._"
          } >> "$GITHUB_STEP_SUMMARY"
