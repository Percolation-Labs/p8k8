name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/workflows/**"

concurrency:
  group: deploy-p8-arm
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: percolationlabs
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            percolationlabs/p8k8:arm64
            percolationlabs/p8k8:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Roll out p8-api
        run: |
          kubectl set image deployment/p8-api p8-api=percolationlabs/p8k8:sha-${{ github.sha }} -n p8
          kubectl rollout status deployment/p8-api -n p8 --timeout=180s

      - name: Post-deploy summary
        if: always()
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-12)
          WHOAMI_CODE=$(curl -sS -o /tmp/whoami_body.json -w "%{http_code}" https://api.percolationlabs.ai/whoami/ || echo "000")
          WHOAMI_STATUS="✅ HTTP $WHOAMI_CODE"
          if [ "$WHOAMI_CODE" != "200" ]; then WHOAMI_STATUS="❌ HTTP $WHOAMI_CODE"; fi

          {
            echo "## Deploy summary"
            echo ""
            echo "**Image:** \`percolationlabs/p8k8:sha-${SHA_SHORT}\`"
            echo "**Commit:** [${SHA_SHORT}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})"
            echo ""
            echo "### Quick checks"
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| API (\`/whoami\`) | $WHOAMI_STATUS |"
            echo ""
            echo "**Response body:**"
            echo '```json'
            cat /tmp/whoami_body.json 2>/dev/null || echo "(no response body)"
            echo '```'
            echo ""
            echo "### Pods"
            echo '```'
            kubectl get pods -n p8 2>&1 || echo "kubectl get pods failed"
            echo '```'
            echo ""
            echo "### Useful links"
            echo "- Live API: https://api.percolationlabs.ai/whoami/"
            echo "- This run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "_For a deeper narrated health check (logs, anomalies), comment \`@claude check cluster health\` on any issue — optional, not run automatically._"
          } >> "$GITHUB_STEP_SUMMARY"
