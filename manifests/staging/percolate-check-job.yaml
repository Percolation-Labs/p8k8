apiVersion: batch/v1
kind: Job
metadata:
  name: staging-check
  namespace: p8-staging
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: postgres
          restartPolicy: Always  # native sidecar (K8s 1.28+) - tied to the pod's lifecycle,
                                  # terminates when the main "runner" container exits so the
                                  # Job actually reaches Complete/Failed instead of hanging as
                                  # "Running" forever.
          image: percolationlabs/rem-pg:18-arm64
          env:
            - name: POSTGRES_DB
              value: p8
            - name: POSTGRES_USER
              value: p8
            - name: POSTGRES_PASSWORD
              value: p8_dev
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust
          args: ["-c", "shared_preload_libraries=pg_cron", "-c", "cron.database_name=p8"]
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "p8", "-d", "p8"]
            initialDelaySeconds: 2
            periodSeconds: 2

      containers:
        - name: runner
          image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
          env:
            - name: BRANCH_REF
              value: "main"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: staging-github-token
                  key: token
            - name: P8_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: staging-app-secrets
                  key: P8_OPENAI_API_KEY
            - name: P8_MOONSHOT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: staging-app-secrets
                  key: P8_MOONSHOT_API_KEY
            - name: P8_S3_ENDPOINT_URL
              valueFrom:
                secretKeyRef:
                  name: staging-s3-secrets
                  key: P8_S3_ENDPOINT_URL
            - name: P8_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: staging-s3-secrets
                  key: P8_S3_BUCKET
            - name: P8_S3_REGION
              valueFrom:
                secretKeyRef:
                  name: staging-s3-secrets
                  key: P8_S3_REGION
            - name: P8_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: staging-s3-secrets
                  key: P8_S3_ACCESS_KEY_ID
            - name: P8_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: staging-s3-secrets
                  key: P8_S3_SECRET_ACCESS_KEY
            - name: P8_DATABASE_URL
              value: "postgresql://p8:p8_dev@localhost:5432/p8"
            - name: P8_KMS_PROVIDER
              value: local
            - name: P8_KMS_LOCAL_KEYFILE
              value: "/work/.keys/.dev-master.key"
          command:
            - bash
            - -c
            - |
              OVERALL_STATUS=0
              echo "=== Installing system deps ==="
              apt-get update -qq && apt-get install -y -qq git gcc g++ curl postgresql-client > /dev/null

              echo "=== Waiting for postgres ==="
              until pg_isready -h localhost -U p8 -d p8 -q; do sleep 1; done
              echo "postgres ready"

              echo "=== Cloning branch: $BRANCH_REF ==="
              git clone --quiet "https://x-access-token:${GITHUB_TOKEN}@github.com/Percolation-Labs/p8k8.git" /work
              cd /work
              git checkout --quiet "$BRANCH_REF"
              mkdir -p .keys
              echo "Checked out $(git rev-parse HEAD)"

              echo "=== Running mypy ==="
              if ! uv run mypy p8; then
                echo "RESULT: mypy FAILED"
                OVERALL_STATUS=1
              fi

              echo "=== Running migrations ==="
              if ! uv run p8 migrate; then
                echo "RESULT: migrate FAILED"
                OVERALL_STATUS=1
              fi

              # Soft time budget for the test phases (unit+integration combined).
              # Not a hard cutoff — we still let the suite finish so results are
              # meaningful — but breaching it prints a loud warning so the suite
              # getting slower over time is visible, not silent, before it
              # gets bad enough to need a hard cap or parallelization.
              TEST_BUDGET_SECONDS=300

              T0=$(date +%s)
              echo "=== Running unit tests ==="
              if ! uv run pytest tests/unit -q; then
                echo "RESULT: unit tests FAILED"
                OVERALL_STATUS=1
              fi
              T1=$(date +%s)
              UNIT_SECONDS=$((T1 - T0))
              echo "unit tests: ${UNIT_SECONDS}s"

              echo "=== Running integration tests ==="
              if ! uv run pytest tests/integration -q; then
                echo "RESULT: integration tests FAILED"
                OVERALL_STATUS=1
              fi
              T2=$(date +%s)
              INTEGRATION_SECONDS=$((T2 - T1))
              echo "integration tests: ${INTEGRATION_SECONDS}s"

              TEST_TOTAL_SECONDS=$((T2 - T0))
              echo ""
              echo "=== Test phase duration: ${TEST_TOTAL_SECONDS}s (budget: ${TEST_BUDGET_SECONDS}s) ==="
              if [ "$TEST_TOTAL_SECONDS" -gt "$TEST_BUDGET_SECONDS" ]; then
                echo "⚠️  SLOW: test phase exceeded the ${TEST_BUDGET_SECONDS}s budget by $((TEST_TOTAL_SECONDS - TEST_BUDGET_SECONDS))s."
                echo "⚠️  Consider parallelizing (pytest-xdist) or splitting slow tests before this creeps further."
              fi

              # Smoke test the REAL production dispatch path, not a CLI shortcut:
              # cron's own enqueue function -> task_queue row -> a real worker
              # process claims it -> dispatches to a registered handler. This is
              # what actually broke in production (percolate_ingest tasks failed
              # with "No handler registered" because only p8-api got redeployed,
              # not the worker deployments) -- calling `p8 percolate ingest`
              # directly, in-process, bypasses this whole path and can't catch
              # that class of bug. Never do that again here.
              echo "=== Enqueueing percolate ingest tasks (real cron function) ==="
              PGPASSWORD=p8_dev psql -h localhost -U p8 -d p8 -c "SELECT enqueue_percolate_ingest_tasks();"

              echo "=== Running the real worker to drain the queue (real external APIs) ==="
              if ! uv run python -m p8.workers.processor --tier small --exit-when-idle --poll-interval 1; then
                echo "RESULT: worker process FAILED"
                OVERALL_STATUS=1
              fi

              echo "=== Checking for failed tasks (e.g. unregistered handlers) ==="
              FAILED_TASKS=$(PGPASSWORD=p8_dev psql -h localhost -U p8 -d p8 -tAc "
                SELECT count(*) FROM task_queue WHERE task_type = 'percolate_ingest' AND status = 'failed';
              ")
              if [ "$FAILED_TASKS" != "0" ]; then
                echo "::error::$FAILED_TASKS percolate_ingest task(s) failed via the real worker dispatch path:"
                PGPASSWORD=p8_dev psql -h localhost -U p8 -d p8 -c "
                  SELECT payload->>'source_key' AS source, error FROM task_queue
                  WHERE task_type = 'percolate_ingest' AND status = 'failed';
                "
                OVERALL_STATUS=1
              fi

              echo "=== Acceptance check: querying real DB state ==="
              PGPASSWORD=p8_dev psql -h localhost -U p8 -d p8 -c "
                SELECT count(*) AS total_events,
                       count(*) FILTER (WHERE primary_source_url IS NOT NULL AND primary_source_url != '') AS with_primary_source,
                       count(*) FILTER (WHERE status = 'interpreted') AS interpreted
                FROM percolate_events;
              " || OVERALL_STATUS=1

              echo "=== STAGING CHECK COMPLETE: overall_status=$OVERALL_STATUS  test_phase_seconds=$TEST_TOTAL_SECONDS ==="
              exit $OVERALL_STATUS
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
      volumes:
        - name: pgdata
          emptyDir: {}
