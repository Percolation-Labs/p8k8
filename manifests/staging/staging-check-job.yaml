apiVersion: batch/v1
kind: Job
metadata:
  name: staging-check
  namespace: p8-staging
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: postgres
          restartPolicy: Always  # native sidecar (K8s 1.28+) - tied to the pod's lifecycle,
                                  # terminates when the main "runner" container exits so the
                                  # Job actually reaches Complete/Failed instead of hanging as
                                  # "Running" forever.
          image: percolationlabs/rem-pg:18-arm64
          env:
            - name: POSTGRES_DB
              value: p8
            - name: POSTGRES_USER
              value: p8
            - name: POSTGRES_PASSWORD
              value: p8_dev
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust
          args: ["-c", "shared_preload_libraries=pg_cron", "-c", "cron.database_name=p8"]
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "p8", "-d", "p8"]
            initialDelaySeconds: 2
            periodSeconds: 2

      containers:
        - name: runner
          image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
          env:
            - name: BRANCH_REF
              value: "main"
            - name: RUN_SMOKE_TEST
              value: "auto"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: staging-github-token
                  key: token
            - name: P8_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: staging-app-secrets
                  key: P8_OPENAI_API_KEY
            - name: P8_MOONSHOT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: staging-app-secrets
                  key: P8_MOONSHOT_API_KEY
            - name: P8_S3_ENDPOINT_URL
              valueFrom:
                secretKeyRef:
                  name: staging-s3-secrets
                  key: P8_S3_ENDPOINT_URL
            - name: P8_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: staging-s3-secrets
                  key: P8_S3_BUCKET
            - name: P8_S3_REGION
              valueFrom:
                secretKeyRef:
                  name: staging-s3-secrets
                  key: P8_S3_REGION
            - name: P8_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: staging-s3-secrets
                  key: P8_S3_ACCESS_KEY_ID
            - name: P8_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: staging-s3-secrets
                  key: P8_S3_SECRET_ACCESS_KEY
            - name: P8_DATABASE_URL
              value: "postgresql://p8:p8_dev@localhost:5432/p8"
            - name: P8_KMS_PROVIDER
              value: local
            - name: P8_KMS_LOCAL_KEYFILE
              value: "/work/.keys/.dev-master.key"
          command:
            - bash
            - -c
            - |
              OVERALL_STATUS=0
              echo "=== Installing system deps ==="
              apt-get update -qq && apt-get install -y -qq git gcc g++ curl postgresql-client > /dev/null

              echo "=== Waiting for postgres ==="
              until pg_isready -h localhost -U p8 -d p8 -q; do sleep 1; done
              echo "postgres ready"

              echo "=== Cloning branch: $BRANCH_REF ==="
              git clone --quiet "https://x-access-token:${GITHUB_TOKEN}@github.com/Percolation-Labs/p8k8.git" /work
              cd /work
              git checkout --quiet "$BRANCH_REF"
              mkdir -p .keys
              echo "Checked out $(git rev-parse HEAD)"

              echo "=== Running mypy ==="
              if ! uv run mypy p8; then
                echo "RESULT: mypy FAILED"
                OVERALL_STATUS=1
              fi

              echo "=== Running migrations ==="
              if ! uv run p8 migrate; then
                echo "RESULT: migrate FAILED"
                OVERALL_STATUS=1
              fi

              # Soft time budget for the test phases (unit+integration combined).
              # Not a hard cutoff — we still let the suite finish so results are
              # meaningful — but breaching it prints a loud warning so the suite
              # getting slower over time is visible, not silent, before it
              # gets bad enough to need a hard cap or parallelization.
              TEST_BUDGET_SECONDS=300

              T0=$(date +%s)
              echo "=== Running unit tests (parallel: -n auto) ==="
              # tests/unit is fully mocked (no DB), so it's safe to fan out across
              # all available cores. See tests/README.md#parallel-execution.
              if ! uv run pytest tests/unit -q -n auto; then
                echo "RESULT: unit tests FAILED"
                OVERALL_STATUS=1
              fi
              T1=$(date +%s)
              UNIT_SECONDS=$((T1 - T0))
              echo "unit tests: ${UNIT_SECONDS}s"

              echo "=== Running integration tests (serial) ==="
              # NOT parallelized: tests/integration hits one shared Postgres instance
              # and several tests share fixed/deterministic IDs (e.g. the seeded
              # default test user, tests/integration/dreaming/fixtures.py::TEST_USER_ID)
              # with no per-test transaction rollback or namespacing. Running these
              # concurrently under pytest-xdist would risk cross-test row interference.
              # See tests/README.md#parallel-execution for the full analysis.
              if ! uv run pytest tests/integration -q; then
                echo "RESULT: integration tests FAILED"
                OVERALL_STATUS=1
              fi
              T2=$(date +%s)
              INTEGRATION_SECONDS=$((T2 - T1))
              echo "integration tests: ${INTEGRATION_SECONDS}s"

              TEST_TOTAL_SECONDS=$((T2 - T0))
              echo ""
              echo "=== Test phase duration: ${TEST_TOTAL_SECONDS}s (budget: ${TEST_BUDGET_SECONDS}s) ==="
              if [ "$TEST_TOTAL_SECONDS" -gt "$TEST_BUDGET_SECONDS" ]; then
                echo "⚠️  SLOW: test phase exceeded the ${TEST_BUDGET_SECONDS}s budget by $((TEST_TOTAL_SECONDS - TEST_BUDGET_SECONDS))s."
                echo "⚠️  Consider parallelizing (pytest-xdist) or splitting slow tests before this creeps further."
              fi

              # Smoke test the REAL production dispatch path, not a CLI shortcut:
              # cron's own enqueue function -> task_queue row -> a real worker
              # process claims it -> dispatches to a registered handler. That
              # path is what broke in production once (tasks failed with "No
              # handler registered" because only p8-api got redeployed, not the
              # worker deployments), and calling a handler in-process bypasses
              # it entirely. Never do that here.
              #
              # It runs through the daily news task: one seeded user with one
              # feed, enqueue_news_tasks() exactly as pg_cron calls it, and the
              # worker drains it against the real feed and the real model. It
              # used to run the event-detection ingest, which is retired.
              #
              # This is the expensive part of the check and most commits do not
              # touch anything it would catch. staging-verify.yml sets
              # RUN_SMOKE_TEST from whether the diff touches a dispatch-critical
              # path (always "true" for manual/batch runs); mypy/unit/integration
              # above always run regardless.
              if [ "$RUN_SMOKE_TEST" = "true" ]; then
                echo "=== Seeding one user with one feed ==="
                PGPASSWORD=p8_dev psql -h localhost -U p8 -d p8 -v ON_ERROR_STOP=1 -c "
                  INSERT INTO users (id, name, email, metadata)
                  VALUES ('00000000-0000-0000-0000-00000000cafe', 'staging-smoke', 'smoke@example.com',
                          '{\"feeds\": [{\"url\": \"https://hnrss.org/frontpage\", \"name\": \"HN\"}]}')
                  ON CONFLICT (id) DO NOTHING;" || OVERALL_STATUS=1

                echo "=== Enqueueing news tasks (real cron function) ==="
                ENQUEUED=$(PGPASSWORD=p8_dev psql -h localhost -U p8 -d p8 -tAc "SELECT enqueue_news_tasks();")
                echo "enqueued: $ENQUEUED"
                if [ "${ENQUEUED:-0}" -lt 1 ]; then
                  echo "::error::enqueue_news_tasks() queued nothing for a user with a feed"
                  OVERALL_STATUS=1
                fi
                # The integration tests leave users with interests behind, and
                # the cron function queues a task for each of them too -- ten
                # of them made this step take eight minutes, fetching feeds for
                # fixtures. Only the seeded user's task is kept; the function
                # that queued it is still the one pg_cron runs.
                PGPASSWORD=p8_dev psql -h localhost -U p8 -d p8 -qc "
                  DELETE FROM task_queue WHERE task_type = 'news' AND status = 'pending'
                     AND user_id <> '00000000-0000-0000-0000-00000000cafe';"

                echo "=== Running the real worker to drain the queue (real feed, real model) ==="
                # --extra platoon, as the production image installs it: the news
                # handler reads feeds through it, and a worker without it fails
                # every task with "No module named 'platoon'".
                if ! uv run --extra platoon python -m p8.workers.processor --tier small --exit-when-idle --poll-interval 1; then
                  echo "RESULT: worker process FAILED"
                  OVERALL_STATUS=1
                fi

                echo "=== Checking the task finished through the dispatch path ==="
                PGPASSWORD=p8_dev psql -h localhost -U p8 -d p8 -c "
                  SELECT status, error FROM task_queue
                   WHERE task_type = 'news' AND user_id = '00000000-0000-0000-0000-00000000cafe';"
                DONE=$(PGPASSWORD=p8_dev psql -h localhost -U p8 -d p8 -tAc "
                  SELECT count(*) FROM task_queue
                   WHERE task_type = 'news' AND user_id = '00000000-0000-0000-0000-00000000cafe'
                     AND status = 'completed';")
                if [ "$DONE" != "1" ]; then
                  echo "::error::the smoke user's news task did not complete via the real worker dispatch path"
                  OVERALL_STATUS=1
                fi

                echo "=== Acceptance check: the feed became resources ==="
                RESOURCES=$(PGPASSWORD=p8_dev psql -h localhost -U p8 -d p8 -tAc "
                  SELECT count(*) FROM resources
                   WHERE user_id = '00000000-0000-0000-0000-00000000cafe' AND deleted_at IS NULL;")
                echo "resources for the smoke user: $RESOURCES"
                [ "${RESOURCES:-0}" -ge 1 ] || { echo "::error::the news task completed and wrote no resources"; OVERALL_STATUS=1; }
              else
                echo "=== Skipping the dispatch smoke test (RUN_SMOKE_TEST=$RUN_SMOKE_TEST) ==="
                echo "No dispatch-critical paths changed. Add the 'full-check' label to a PR to force this."
              fi

              echo "=== STAGING CHECK COMPLETE: overall_status=$OVERALL_STATUS  test_phase_seconds=$TEST_TOTAL_SECONDS ==="
              exit $OVERALL_STATUS
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
      volumes:
        - name: pgdata
          emptyDir: {}
